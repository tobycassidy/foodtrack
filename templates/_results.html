{% if foods %}
<ul class="results">
{% for f in foods %}
  <li>
    <button type="button" class="pick" data-id="{{ f.id }}" data-name="{{ f.name }}{% if f.brand %} ({{ f.brand }}){% endif %}" data-serving="{{ f.serving_size_g or '' }}" data-serving-desc="{{ f.serving_desc or '' }}" data-kcal="{{ f.kcal if f.kcal is not none else '' }}" data-protein="{{ f.protein_g if f.protein_g is not none else '' }}" data-carbs="{{ f.carbs_g if f.carbs_g is not none else '' }}" data-fat="{{ f.fat_g if f.fat_g is not none else '' }}" data-fibre="{{ f.fibre_g if f.fibre_g is not none else '' }}">
      <span class="fname">{{ f.name }}</span>
      <span class="fmeta">{% if f.brand %}{{ f.brand }} · {% endif %}{{ f.kcal|round|int if f.kcal is not none else '?' }} kcal, {{ f.protein_g if f.protein_g is not none else '?' }} g protein per 100 g</span>
    </button>
  </li>
{% endfor %}
</ul>
<p class="fmeta addnew">Not the right one? <a href="/foods/new?name={{ q|urlencode }}">Add “{{ q }}” as a new food</a>.</p>
{% elif q %}
<p class="empty">Nothing saved called “{{ q }}”.
  <a href="/foods/new?name={{ q|urlencode }}">Add it</a> (label photo or name only); it'll be added to your basket when saved.</p>
{% endif %}
